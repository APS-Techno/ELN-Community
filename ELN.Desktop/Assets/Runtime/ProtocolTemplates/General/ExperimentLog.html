<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    margin: 20px;
    color: #222;
    font-size: 13px;
    background: #fff;
  }
  h2 {
    margin: 0 0 4px 0;
    font-size: 18px;
    font-weight: 600;
    color: #1a5276;
  }
  .subtitle {
    color: #777;
    font-size: 11px;
    margin-bottom: 16px;
    border-bottom: 2px solid #1a5276;
    padding-bottom: 8px;
  }
  fieldset {
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 12px 16px;
    margin-bottom: 14px;
  }
  legend {
    font-weight: 600;
    font-size: 13px;
    color: #1a5276;
    padding: 0 6px;
  }
  label {
    display: block;
    margin: 8px 0 3px 0;
    font-weight: 600;
    font-size: 12px;
    color: #555;
  }
  input, select, textarea {
    width: 100%;
    padding: 5px 8px;
    border: 1px solid #ccc;
    border-radius: 3px;
    font-size: 13px;
    box-sizing: border-box;
    font-family: inherit;
  }
  input:focus, select:focus, textarea:focus {
    border-color: #1a5276;
    outline: none;
    box-shadow: 0 0 3px rgba(26,82,118,0.2);
  }
  .row { display: flex; gap: 12px; }
  .col { flex: 1; }
  .col-2 { flex: 2; }
</style>
</head>
<body>

<h2>Experiment Log</h2>
<div class="subtitle">General-purpose experiment documentation</div>

<fieldset>
  <legend>Experiment Info</legend>
  <div class="row">
    <div class="col"><label>Experiment ID</label>
    <input type="text" name="experimentId" placeholder="e.g. EXP-2026-001"></div>
    <div class="col"><label>Date</label>
    <input type="date" name="date"></div>
    <div class="col"><label>Researcher</label>
    <input type="text" name="researcher" placeholder="Name"></div>
  </div>
  <label>Title</label>
  <input type="text" name="title" placeholder="Short descriptive title of the experiment">
</fieldset>

<fieldset>
  <legend>Objective</legend>
  <textarea name="objective" rows="2" placeholder="What is the goal of this experiment?"></textarea>
</fieldset>

<fieldset>
  <legend>Materials &amp; Equipment</legend>
  <textarea name="materials" rows="3" placeholder="List all materials, reagents, instruments, and equipment used..."></textarea>
</fieldset>

<fieldset>
  <legend>Procedure</legend>
  <textarea name="procedure" rows="5" placeholder="Step-by-step description of the experimental procedure..."></textarea>
</fieldset>

<fieldset>
  <legend>Observations &amp; Results</legend>
  <textarea name="observations" rows="4" placeholder="Record observations, measurements, and raw results..."></textarea>
</fieldset>

<fieldset>
  <legend>Analysis &amp; Conclusions</legend>
  <textarea name="analysis" rows="3" placeholder="Interpretation of results, comparison with expected outcomes..."></textarea>
  <label>Status</label>
  <select name="status">
    <option value="in-progress">In Progress</option>
    <option value="completed">Completed</option>
    <option value="failed">Failed</option>
    <option value="needs-repeat">Needs Repeat</option>
  </select>
</fieldset>

</body>
</html>
