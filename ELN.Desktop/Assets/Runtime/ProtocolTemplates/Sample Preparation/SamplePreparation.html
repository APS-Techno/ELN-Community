<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    margin: 20px;
    color: #222;
    font-size: 13px;
    background: #fff;
  }
  h2 {
    margin: 0 0 4px 0;
    font-size: 18px;
    font-weight: 600;
    color: #2e7d32;
  }
  .subtitle {
    color: #777;
    font-size: 11px;
    margin-bottom: 16px;
    border-bottom: 2px solid #2e7d32;
    padding-bottom: 8px;
  }
  fieldset {
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 12px 16px;
    margin-bottom: 14px;
  }
  legend {
    font-weight: 600;
    font-size: 13px;
    color: #2e7d32;
    padding: 0 6px;
  }
  label {
    display: block;
    margin: 8px 0 3px 0;
    font-weight: 600;
    font-size: 12px;
    color: #555;
  }
  input, select, textarea {
    width: 100%;
    padding: 5px 8px;
    border: 1px solid #ccc;
    border-radius: 3px;
    font-size: 13px;
    box-sizing: border-box;
    font-family: inherit;
  }
  input:focus, select:focus, textarea:focus {
    border-color: #2e7d32;
    outline: none;
    box-shadow: 0 0 3px rgba(46,125,50,0.2);
  }
  .row { display: flex; gap: 12px; }
  .col { flex: 1; }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 8px;
  }
  table th, table td {
    border: 1px solid #ddd;
    padding: 5px 8px;
    font-size: 12px;
    text-align: left;
  }
  table th {
    background: #e8f5e9;
    font-weight: 600;
    color: #2e7d32;
  }
  table input {
    border: none;
    padding: 2px 4px;
    width: 100%;
  }
</style>
</head>
<body>

<h2>Sample Preparation</h2>
<div class="subtitle">Sample fabrication and preparation protocol</div>

<fieldset>
  <legend>Sample Identity</legend>
  <div class="row">
    <div class="col"><label>Sample ID</label>
    <input type="text" name="sampleId" placeholder="e.g. S-2026-001"></div>
    <div class="col"><label>Batch Number</label>
    <input type="text" name="batchNumber" placeholder="e.g. B-042"></div>
    <div class="col"><label>Date</label>
    <input type="date" name="prepDate"></div>
  </div>
  <div class="row">
    <div class="col"><label>Material / Composition</label>
    <input type="text" name="material" placeholder="e.g. TiO2 nanoparticles, Al-6061"></div>
    <div class="col"><label>Substrate</label>
    <input type="text" name="substrate" placeholder="e.g. Si wafer, glass slide, steel coupon"></div>
  </div>
</fieldset>

<fieldset>
  <legend>Preparation Steps</legend>
  <label>Cleaning / Pre-treatment</label>
  <textarea name="cleaning" rows="2" placeholder="e.g. Ultrasonic bath in acetone 10 min, IPA rinse, N2 blow dry"></textarea>

  <label>Preparation Method</label>
  <select name="method">
    <option value="">-- Select method --</option>
    <option value="spin-coating">Spin Coating</option>
    <option value="dip-coating">Dip Coating</option>
    <option value="sputtering">Sputtering</option>
    <option value="evaporation">Evaporation</option>
    <option value="cvd">CVD</option>
    <option value="sol-gel">Sol-Gel</option>
    <option value="mechanical">Mechanical Processing</option>
    <option value="other">Other</option>
  </select>

  <label>Process Parameters</label>
  <textarea name="processParams" rows="3" placeholder="Temperature, pressure, speed, duration, atmosphere..."></textarea>

  <label>Post-treatment</label>
  <textarea name="postTreatment" rows="2" placeholder="Annealing, etching, polishing..."></textarea>
</fieldset>

<fieldset>
  <legend>Quality Check</legend>
  <div class="row">
    <div class="col"><label>Visual Inspection</label>
    <select name="visualCheck">
      <option value="pass">Pass</option>
      <option value="minor-defects">Minor Defects</option>
      <option value="fail">Fail</option>
    </select></div>
    <div class="col"><label>Thickness / Dimension</label>
    <input type="text" name="thickness" placeholder="e.g. 150 nm, 2.0 mm"></div>
  </div>
  <label>Notes</label>
  <textarea name="notes" rows="2" placeholder="Any deviations, observations, storage conditions..."></textarea>
</fieldset>

</body>
</html>
