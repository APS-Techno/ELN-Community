<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<base id="docBase" />
<link rel="stylesheet" href="vendor/katex.min.css" />
<link rel="stylesheet" href="shell.css" />
<script src="vendor/markdown-it.min.js"></script>
<script src="vendor/markdown-it-footnote.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/katex.min.js"></script>
<script src="vendor/auto-render.min.js"></script>
</head>
<body>
<div id="content"></div>
<script>
// Allow Delphi-generated eln-link anchors, then sanitize untrusted attachments
// before insertion: raw HTML can execute against the file:/// base.
const md = window.markdownit({ html: true, linkify: true, typographer: true })
  .use(window.markdownitFootnote);

// Permit only safe schemes plus the custom eln:// navigation scheme (the host
// intercepts eln:// clicks). The [^a-z] / [a-z+.-]+ branches keep relative URLs
// (attachment images resolved against the file:/// base). javascript:, data:,
// vbscript:, and file: are intentionally excluded.
var ELN_SAFE_URI = /^(?:(?:https?|mailto|tel|eln):|[^a-z]|[a-z+.\-]+(?:[^a-z+.\-:]|$))/i;

window.renderMarkdown = function(mdText, baseHref) {
  const baseEl = document.getElementById('docBase');
  if (baseHref) {
    baseEl.setAttribute('href', baseHref);
  } else {
    baseEl.removeAttribute('href');
  }
  const container = document.getElementById('content');
  // Never fall back to unsanitized innerHTML when DOMPurify is unavailable.
  if (!window.DOMPurify || typeof window.DOMPurify.sanitize !== 'function') {
    container.textContent = '';
    var warn = document.createElement('div');
    warn.style.cssText = 'margin:16px;padding:12px 16px;border:1px solid #d9534f;' +
      'background:#f2dede;color:#a94442;border-radius:4px;' +
      'font-family:Segoe UI,sans-serif;font-size:14px;';
    warn.textContent = 'Markdown viewer assets are out of date — please reinstall or redeploy the plugin.';
    container.appendChild(warn);
    return;
  }
  container.innerHTML = window.DOMPurify.sanitize(md.render(mdText), {
    ALLOWED_URI_REGEXP: ELN_SAFE_URI
  });
  window.renderMathInElement(container, {
    delimiters: [
      { left: '$$', right: '$$', display: true },
      { left: '$',  right: '$',  display: false }
    ],
    throwOnError: false
  });
};
</script>
</body>
</html>
